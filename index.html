    unsigned char sw;
    P1 = P1 | 0x0F; // P1.0-P1.3 as inputs
    while (1) {
        sw = P1 & 0x0F; // mask the four switch bits
        if (sw & 0x01) P2 |= 0x01; else P2 &= ~0x01; // switch 1 -> LED P2.0

        function escapeHtml(str) {
            return str

                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Copy raw text reliably inside iframe or browser
        function copyTextToClipboard(text, btnElement) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const originalText = btnElement.textContent;
                    btnElement.textContent = '[Copied]';
                    setTimeout(() => {
                        btnElement.textContent = originalText;
                    }, 1500);
                }
                return true;
            } catch (err) {
                return false;
            } finally {
                document.body.removeChild(textarea);
            }
        }

        }

        // Append arbitrary HTML block to terminal stream
        function appendOutputBlock(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent;
            terminalBody.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        // Format Experiment Block strictly in monochrome with minimal [Copy] button
        function renderExperimentBlock(expKey) {
            const exp = experiments[expKey];
            if (!exp) return '';
            const uniqueBtnId = `copy-btn-${expKey}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            return `
                <div class="my-1 border border-[#555555] bg-black p-3">
                    <div class="flex items-center justify-between border-b border-[#444444] pb-1.5 mb-2 text-xs sm:text-sm text-[#cccccc]">
                        <span>// ${escapeHtml(exp.title)}</span>
                        <button 
                            id="${uniqueBtnId}"
                            onclick="copyExperimentCode('${expKey}', '${uniqueBtnId}')" 
                            class="text-[#ffffff] hover:bg-[#cccccc] hover:text-black px-1.5 py-0.5 border border-[#777777] text-xs cursor-pointer select-none"
                        >[Copy]</button>
                    </div>
                    <pre class="text-[#ffffff] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-relaxed select-all"><code>${escapeHtml(exp.code)}</code></pre>
                </div>
            `;
        }

        function renderExperimentList() {
            const listItems = [
                ["1", "8085 Subtraction & 8051 Switch LEDs"],
                ["2", "8085 24-bit Addition & 8051 Smart Home Lights"],
                ["3", "8085 Division & 8051 Security Panel"],
                ["4", "8085 16-bit Multiplication & 8051 Access Control"],
                ["5", "8085 Memory Block Transfer & 8051 Tank Pump"],
                ["6", "8085 Cube Calc & 8051 XOR Toggle"],
                ["7", "8085 2's Complement & 8051 Shopping Total"],
                ["8", "8085 8-bit Multiplication & 8051 Streetlights"],
                ["9", "8051 Timer Delay & 8085 Student Marks"],
                ["10", "8051 Traffic Light & 8085 Banking"],
                ["11", "8051 Stepper Motor & 8085 Book Inventory"],
                ["12", "8051 Port Bit Ops & 8085 Gross Salary"],
                ["13", "8051 AND/OR/XOR & 8085 Electricity Bill"],
                ["14", "8051 ADC Interface & 8085 Vote Counting"],
                ["15", "8051 DAC Triangular & 8085 Attendance"],
                ["16", "8051 Timer 1 C Code & 8085 Inventory Monitor"],
                ["17", "8051 Serial Echo & 8085 Patient Priority"],
                ["18", "8085 16-bit Sub & 8085 Rank Sorting"],
                ["19", "8051 Decimal Counter & 8051 Smart Irrigation"],
                ["20", "8051 DAC Square Wave & 8051 Automated Inspection"]
            ];

            let rows = '';
            listItems.forEach(([cmd, title]) => {
                const paddedKey = cmd.padEnd(4, ' ');
                const paddedTitle = title.padEnd(64, ' ');
                rows += `| ${paddedKey} | ${escapeHtml(paddedTitle)} |\n`;
            });

            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+------+------------------------------------------------------------------+
| Q#   | Question Title (8085 & 8051 Practical)                           |
+------+------------------------------------------------------------------+
${rows}+------+------------------------------------------------------------------+
20 rows in set (0.00 sec)
Commands: type 1-20 to view, cp &lt;num&gt; to copy, cls to clear.</pre>
            `;
        }

        // Normalize key
        function normalizeKey(str) {
            return str.replace(/\./g, '').toLowerCase();
        }

        // Main command router
        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            // Record command history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Strip trailing semicolon if user types "1;" or "ls;"
            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();
            const norm = normalizeKey(lower);

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === 'exit') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Check question number (1-20)
            if (experiments.hasOwnProperty(norm)) {
                appendOutputBlock(renderExperimentBlock(norm));
                return;
            }

            // Support "exp 1", "q1", "q 1", "question 1", "ans 1", etc.
            const expMatch = norm.match(/^(?:exp|experiment|ex|q|question|ans|answer|p|prac|practical)\s*([0-9]{1,2})$/);
            if (expMatch) {
                const target = expMatch[1];
                if (experiments.hasOwnProperty(target)) {
                    appendOutputBlock(renderExperimentBlock(target));
                    return;
                }
            }

            // List all questions
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === '?') {
                appendOutputBlock(renderExperimentList());
                return;
            }

            // Copy command: "copy <1-20>" or "cp <num>"
            const copyMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})$/);
            if (copyMatch) {
                const targetKey = normalizeKey(copyMatch[1]);
                if (experiments.hasOwnProperty(targetKey)) {
                    const ok = copyTextToClipboard(experiments[targetKey].code, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${targetKey} code copied to clipboard.</div>`);
                    }
                    return;
                }
            }

            // All questions at once (1 to 20)
            if (lower === 'all') {
                for (let i = 1; i <= 20; i++) {
                    const k = String(i);
                    if (experiments[k]) {
                        appendOutputBlock(renderExperimentBlock(k));
                    }
                }
                return;
            }

            // Unknown command fallback
            appendOutputBlock(`
                <div class="text-[#cccccc] whitespace-pre-wrap">'${escapeHtml(trimmed)}' is not recognized as an internal or external command.
Type '1'-'20' for question details, 'ls' to list all questions, 'cp &lt;num&gt;' to copy, or 'cls' to clear.</div>
            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();
        }

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep input focused when clicking terminal background unless selecting code text
        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }

        // Initialize Terminal on Load
        window.onload = () => {
            renderWelcomeBanner();
            cmdInput.focus();
        };
    </script>
</body>
</html>
