        const terminalBody = document.getElementById('terminal-body');
        const cmdInput = document.getElementById('cmd-input');
        let commandHistory = [];
        let historyIndex = -1;

        // Escape HTML characters safely
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Copy raw SQL text reliably inside iframe or browser
        function copyTextToClipboard(text, btnElement) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const originalText = btnElement.textContent;
                    btnElement.textContent = '[Copied]';
                    setTimeout(() => {
                        btnElement.textContent = originalText;
                    }, 1500);
                }
                return true;
            } catch (err) {
                return false;
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Copy by experiment key
        function copyExperimentSQL(expKey, btnId) {
            const exp = experiments[expKey];
            if (!exp) return;
            const btn = btnId ? document.getElementById(btnId) : null;

        // Append echoed mysql> command line
        function appendCommandEcho(rawCmd) {
            const cmdLine = document.createElement('div');
            cmdLine.className = "text-[#cccccc] whitespace-pre-wrap pt-1";
            cmdLine.innerHTML = `mysql&gt; <span class="text-[#ffffff]">${escapeHtml(rawCmd)}</span>`;

        }

        // Append arbitrary HTML block to terminal stream
        function appendOutputBlock(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent;
            terminalBody.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        // Format Experiment SQL Block strictly in monochrome with minimal [Copy] button
        function renderExperimentBlock(expKey) {
            const exp = experiments[expKey];
            const uniqueBtnId = `copy-btn-${expKey}-${Date.now()}`;
            return `
                <div class="my-1 border border-[#555555] bg-black p-3">
                    <div class="flex items-center justify-between border-b border-[#444444] pb-1.5 mb-2 text-xs sm:text-sm text-[#cccccc]">
                        <span>-- ${escapeHtml(exp.title)}</span>
                        <button

                            onclick="copyExperimentSQL('${expKey}', '${uniqueBtnId}')" 
                            class="text-[#ffffff] hover:bg-[#cccccc] hover:text-black px-1.5 py-0.5 border border-[#777777] text-xs cursor-pointer select-none"
                        >[Copy]</button>
                    </div>
                    <pre class="text-[#ffffff] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-relaxed select-all"><code>${escapeHtml(exp.sql)}</code></pre>
                </div>
            `;
        }

        // Render ASCII Table List of all Experiments
        function renderExperimentList() {
            let rows = '';
            Object.keys(experiments).forEach(key => {
                const exp = experiments[key];
                const paddedKey = key.padEnd(4, ' ');
                const paddedTitle = exp.title.padEnd(60, ' ');
                rows += `| ${paddedKey} | ${escapeHtml(paddedTitle)} |\n`;
            });

            return `

            `;
        }

        // Render monochrome Hosting Guide
        function renderHostGuide() {
            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-snug">+--------------------------------------------------------------------+
| FREE CUSTOM DOMAIN HOSTING GUIDE                                   |
+--------------------------------------------------------------------+
1. Save this code as index.html inside an empty folder.
2. Open https://app.netlify.com/drop in your browser.
3. Drag and drop the folder onto the page.
4. Go to Site Configuration -> Change site name -> set an easy name
   such as: mysqllab.netlify.app</pre>
            `;
        }

        // Main command router
        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            // Record command history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Strip trailing semicolon if user types SQL style like "1;" or "ls;"
            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === '\\! cls' || lower === 'system cls') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Check direct experiment number (0-9) or 'setup'
            if (lower === 'setup') {
                appendOutputBlock(renderExperimentBlock('0'));
                return;
            }
            if (experiments.hasOwnProperty(lower)) {
                appendOutputBlock(renderExperimentBlock(lower));
                return;
            }

            // Support "exp 1" or "q1" or "question 1"
            const expMatch = lower.match(/^(?:exp|experiment|q|question)\s*([0-9])$/);
            if (expMatch) {
                appendOutputBlock(renderExperimentBlock(expMatch[1]));
                return;
            }

            // List all experiments
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === '?' || lower === '\\h') {
                appendOutputBlock(renderExperimentList());
                return;
            }

            // Copy command: "copy <0-9>" or "cp <0-9>"
            const copyMatch = lower.match(/^(?:copy|cp)\s+([0-9]|setup)$/);
            if (copyMatch) {
                const targetKey = copyMatch[1] === 'setup' ? '0' : copyMatch[1];
                const exp = experiments[targetKey];
                const ok = copyTextToClipboard(exp.sql, null);
                if (ok) {
                    appendOutputBlock(`<div class="text-[#cccccc]">Query copied to clipboard.</div>`);
                }
                return;
            }

            // All experiments at once
            if (lower === 'all') {
                Object.keys(experiments).forEach(k => {
                    if (k !== '0') appendOutputBlock(renderExperimentBlock(k));
                });
                return;
            }

            // Free hosting guide
            if (lower === 'host' || lower === 'domain' || lower === 'deploy') {
                appendOutputBlock(renderHostGuide());
                return;
            }

            // Unknown command fallback mimicking MySQL syntax error
            appendOutputBlock(`
                <div class="text-[#cccccc] whitespace-pre-wrap">ERROR 1064 (42000): You have an error in your SQL syntax; type '1'-'9' for experiment queries, 'ls' to list, 'cp &lt;num&gt;' to copy, or 'cls' to clear.</div>
            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();
        }

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep input focused when clicking terminal background unless selecting SQL text
        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }

        // Initialize Terminal on Load
        window.onload = () => {
            renderWelcomeBanner();
            cmdInput.focus();
        };
    </script>
</body>
</html>
