        .cmd-input:focus {
            outline: none;
        }
        .win-btn:hover {
            background-color: #e5e5e5;
            color: #000000;
        }
        .win-close:hover {
            background-color: #e81123;
            color: #ffffff;

      "answer": "Hardware: one road per port (P0, P1, P2, P3); bit 0 = RED, bit 1 = YELLOW, bit 2 = GREEN\n(active-high LEDs; P0 needs pull-up resistors).\n\n  #include <reg51.h>\n  #define RED 0x01\n  #define YEL 0x02\n  #define GRN 0x04\n\n  void delay_ms(unsigned int ms)\n  {\n          unsigned int i, j;\n          for (i = 0; i < ms; i++)\n                  for (j = 0; j < 123; j++);                     // approx 1 ms at 11.0592 MHz\n  }\n  void show(unsigned char a, unsigned char b, unsigned char c, unsigned char d)\n  {\n          P0 = a; P1 = b; P2 = c; P3 = d;\n  }\n  void main(void)\n  {\n          while (1)\n          {\n                  show(GRN, RED, RED, RED); delay_ms(5000);                  // road 1 GO\n                  show(YEL, RED, RED, RED); delay_ms(1000);\n                  show(RED, GRN, RED, RED); delay_ms(5000);                  // road 2 GO\n                  show(RED, YEL, RED, RED); delay_ms(1000);\n                  show(RED, RED, GRN, RED); delay_ms(5000);                  // road 3 GO\n                  show(RED, RED, YEL, RED); delay_ms(1000);\n                  show(RED, RED, RED, GRN); delay_ms(5000);                  // road 4 GO\n                  show(RED, RED, RED, YEL); delay_ms(1000);\n          }\n  }\n\nDemonstration: at any time only one road shows GREEN, the others show RED. After 5 s\nGREEN changes to YELLOW for 1 s, then the next road turns GREEN, so the cycle repeats\ncontinuously."
    },
    "part_b": {

      "key": "10b",
      "title": "Question 10(ii) \u2014 8085 Banking Operations Simulation",
      "short_title": "8085 Banking Operations Simulation",
      "question": "Develop an 8085 program that simulates basic banking operations. The program should accept an initial account balance and a transaction (deposit or withdrawal), update the balance accordingly, detect insufficient funds during withdrawal, and store the transaction status.",
      "answer": "; 3000H = initial balance, 3001H = type (01 = deposit, 02 = withdrawal)\n  ; 3002H = amount\n  ; 3003H = updated balance\n  ; 3004H = status (00 = success, 01 = insufficient funds, 02 = invalid type)\n        LDA 3001H\n              CPI 01H\n              JZ      DEP\n              CPI 02H\n              JZ WD\n              MVI A,02H                         ; invalid transaction type\n              JMP STAT\n  DEP:        LDA 3000H\n\n              LXI H,3002H\n              ADD M                             ; balance + amount\n              STA 3003H\n              MVI A,00H\n              JMP STAT\n  WD:         LDA 3000H\n              LXI H,3002H\n              SUB M                             ; balance - amount\n              JC INSUF                          ; borrow -> not enough balance\n              STA 3003H\n              MVI A,00H\n              JMP STAT\n  INSUF: LDA 3000H\n        STA 3003H                               ; balance unchanged\n              MVI A,01H\n  STAT: STA 3004H\n              HLT\n\nExample: balance 64H (100), withdrawal 1E (30) gives balance 46H (70), status 00.\nWithdrawal 96H (150) gives balance unchanged, status 01."

      "question": "Develop an 8051 program to rotate a stepper motor anticlockwise for a specified number of steps using a suitable driver.",
      "answer": "Hardware: stepper motor coils driven through a ULN2003 driver on P1.0-P1.3. Full-step\nsequence anticlockwise: 09H, 03H, 06H, 0CH (if your motor turns the wrong way, reverse\nthe order).\n\n              ORG 0000H\n              MOV R2,#12                        ; 12 x 4 = 48 steps\n  AGAIN: MOV P1,#09H\n              ACALL DELAY\n              MOV P1,#03H\n              ACALL DELAY\n              MOV P1,#06H\n              ACALL DELAY\n              MOV P1,#0CH\n              ACALL DELAY\n              DJNZ R2,AGAIN                     ; repeat for the required steps\n              MOV P1,#00H                       ; de-energise coils\n              SJMP $\n  DELAY: MOV R6,#20                             ; about 11 ms step delay\n  D1:         MOV R7,#250\n  D2:         DJNZ R7,D2\n              DJNZ R6,D1\n              RET\n              END\n\nEach pass through the loop gives 4 steps. Number of steps = 4 x R2."

      "title": "Question 11(ii) \u2014 8085 Book Inventory Management",
      "short_title": "8085 Book Inventory Management",
      "question": "Create an 8085 application to maintain the inventory of books. The program should support adding new stock, issuing books, returning books, and generating a low-stock alert when the quantity falls below a specified threshold.",
      "answer": "; 3000H = current stock, 3001H = operation (01 = add stock, 02 = issue, 03 =\n  return)\n  ; 3002H = quantity, 3003H = low-stock threshold\n  ; 3004H = updated stock, 3005H = low-stock alert (01 = LOW, 00 = OK)\n  ; 3006H = status (00 = done, 01 = not enough books to issue, 02 = invalid\n  operation)\n              LDA 3001H\n              CPI 01H\n              JZ ADDS\n              CPI 03H\n              JZ      ADDS                      ; return also increases stock\n              CPI 02H\n              JZ ISSUE\n              MVI A,02H                         ; invalid operation\n              STA 3006H\n        HLT\n  ADDS: LDA 3000H\n              LXI H,3002H\n              ADD M\n              STA 3004H\n\n              MVI A,00H\n              STA 3006H\n              JMP ALERT\n  ISSUE: LDA 3000H\n        LXI H,3002H\n              SUB M\n              JC      NOSTK                     ; quantity > stock\n              STA 3004H\n              MVI A,00H\n              STA 3006H\n              JMP ALERT\n  NOSTK: LDA 3000H\n        STA 3004H                               ; stock unchanged\n              MVI A,01H\n              STA 3006H\n  ALERT: LDA 3004H\n        LXI H,3003H\n              CMP M                             ; stock - threshold\n              MVI A,00H\n              JNC OKK                           ; stock >= threshold\n              MVI A,01H                         ; below threshold -> alert\n  OKK:        STA 3005H\n              HLT\n\nExample: stock 0AH, issue 07H, threshold 05H gives stock 03H and alert 01."

      "short_title": "8051 Port Bit Operations & LEDs",
      "question": "Write an 8051 program to set, clear and complement selected port bits and demonstrate the output using LEDs.",
      "answer": "LEDs on Port 1 (active-high).\n\n              ORG 0000H\n              MOV P1,#00H                          ; all LEDs OFF\n              ORL P1,#00000101B                    ; SET bits 0 and 2      -> P1 = 05H\n              ACALL DELAY\n              ANL P1,#11111110B                    ; CLEAR bit 0           -> P1 = 04H\n              ACALL DELAY\n              XRL P1,#00001100B                    ; COMPLEMENT bits 2,3   -> P1 = 08H\n              ACALL DELAY\n              CPL P1.7                             ; single-bit complement -> P1 = 88H\n              SJMP $\n  DELAY: MOV R6,#0FFH\n  D1:   MOV R7,#0FFH\n  D2:         DJNZ R7,D2\n              DJNZ R6,D1\n              RET\n              END\n\nDemonstration: LEDs P1.0 and P1.2 glow (set), P1.0 goes off (clear), then P1.2 turns off and\nP1.3 turns on (complement), and finally P1.7 turns on."

      "title": "Question 13(ii) \u2014 8085 Slabs-Based Electricity Bill",
      "short_title": "8085 Slabs-Based Electricity Bill",
      "question": "Design an 8085 program to calculate the electricity bill based on the number of units consumed. The application should implement slab-wise tariff calculation and store the final bill amount in memory.",
      "answer": "Tariff used: first 100 units at Rs 1, next 100 units (101-200) at Rs 2, above 200 units at Rs 3.\n\n  ; 3000H = units consumed, 3001H-3002H = bill amount (low byte first)\n              LDA 3000H\n              CPI 65H                           ; 101\n              JC      SLAB1                     ; units <= 100\n              CPI 0C9H                          ; 201\n              JC SLAB2                          ; units <= 200\n              SUI 0C8H                          ; slab 3: A = units - 200\n              MOV E,A\n              ADD A\n              ADD E                             ; A = 3 x (units - 200)\n              MOV E,A\n              MVI D,00H\n              LXI H,012CH                       ; 300 for the first 200 units\n              DAD D\n              JMP SAVE\n  SLAB2: SUI 64H                                ; A = units - 100\n              ADD A                             ; x 2\n              MOV E,A\n              MVI D,00H\n              LXI H,0064H                       ; 100 for the first slab\n              DAD D\n\n              JMP SAVE\n  SLAB1: MOV L,A                                ; bill = units x 1\n        MVI H,00H\n  SAVE: SHLD 3001H\n              HLT\n\nExamples: 50 units gives Rs 50 (0032H); 150 units gives 100 + 100 = Rs 200 (00C8H); 220\nunits gives 300 + 60 = Rs 360 (0168H)."

      "title": "Question 14(i) \u2014 8051 ADC0804 Interface & Conversion",
      "short_title": "8051 ADC0804 Interface & Conversion",
      "question": "Interface an ADC with 8051, initiate conversion through a program and read/store the digital output for two analog input levels.",
      "answer": "ADC0804: data lines D0-D7 to P1, CS to GND, WR to P2.6, RD to P2.5, INTR to P2.7, clock\nfrom the 10K / 150 pF RC network, Vref/2 = 2.5 V (5 V full scale, 19.53 mV per step).\n\n  #include <reg51.h>\n  sbit ADC_RD                 = P2^5;\n  sbit ADC_WR                 = P2^6;\n  sbit ADC_INTR = P2^7;\n  void delay_ms(unsigned int ms)\n  {\n          unsigned int i, j;\n          for (i = 0; i < ms; i++)\n                  for (j = 0; j < 123; j++);\n  }\n  unsigned char read_adc(void)\n  {\n          unsigned char value;\n          ADC_WR = 0;                                 // start conversion: WR low then high\n          ADC_WR = 1;\n          while (ADC_INTR == 1);                      // wait for end of conversion (INTR goes low)\n          ADC_RD = 0;                                 // enable the output\n          value = P1;\n          ADC_RD = 1;\n          return value;\n  }\n  void main(void)\n  {\n          unsigned char level1, level2;\n          P1 = 0xFF;                                  // P1 is an input port\n          ADC_INTR = 1;\n          ADC_RD = 1;\n          ADC_WR = 1;\n\n          level1 = read_adc();                        // analog input 1 (e.g. 1 V)\n          P0 = level1;                                // display / store\n          delay_ms(5000);                             // change the pot to the second level\n          level2 = read_adc();                        // analog input 2 (e.g. 3 V)\n          P0 = level2;\n          while (1);\n  }\n\nExpected digital output = Vin / 19.53 mV: 1 V gives about 33H (51), 3 V gives about 99H\n(153)."
    },
    "part_b": {

      "key": "14b",
      "title": "Question 14(ii) \u2014 8085 Multi-Candidate Vote Counting",
      "short_title": "8085 Multi-Candidate Vote Counting",
      "question": "Develop an 8085 application to count votes received by multiple candidates from a stored dataset, determine the winning candidate, identify ties if any, and store the election results in memory.",
      "answer": "Four candidates (numbered 1 to 4).\n\n  ; 3000H = number of votes, 3001H onwards = votes (each byte = candidate no.\n  1-4)\n  ; 3100H-3103H = vote count of candidates 1-4\n  ; 3104H = winner no., 3105H = winner's votes, 3106H = tie flag (01 = tie)\n              LXI H,3100H                       ; clear the counters\n              MVI B,04H\n              XRA A\n  CLR:        MOV M,A\n              INX H\n              DCR B\n              JNZ CLR\n              LDA 3000H\n              ORA A\n              JZ EXIT                           ; no votes\n              MOV C,A\n              LXI H,3001H\n  CNT:        MOV A,M                           ; candidate number\n              DCR A                             ; index 0-3\n              MOV E,A\n              MVI D,00H\n              PUSH H\n              LXI H,3100H\n              DAD D\n              INR M                             ; count++\n              POP H\n              INX H\n              DCR C\n              JNZ CNT\n              LXI H,3100H                       ; find the winner\n              MOV B,M                           ; B = highest votes\n\n              MVI D,01H                         ; D = winner number\n              MVI E,01H                         ; E = current candidate\n              MVI C,03H\n  FIND: INX H\n              INR E\n              MOV A,M\n              CMP B\n              JC      NEXT\n              JZ NEXT\n              MOV B,A\n              MOV D,E\n  NEXT: DCR C\n              JNZ FIND\n              MOV A,D\n              STA 3104H\n              MOV A,B\n              STA 3105H\n              LXI H,3100H                       ; tie check: how many have the highest count?\n              MVI C,04H\n              MVI E,00H\n  TIE:        MOV A,M\n              CMP B\n              JNZ SKIP\n              INR E\n  SKIP: INX H\n        DCR C\n              JNZ TIE\n              MOV A,E\n              CPI 02H\n              MVI A,00H\n              JC      NOTIE                     ; only one candidate has the highest count\n              MVI A,01H                         ; two or more -> tie\n  NOTIE: STA 3106H\n  EXIT: HLT\n\nExample: votes 1,2,1,3,1,2 give counts 3,2,1,0, winner 01 with 03 votes, tie flag 00."
    }
  },

      "short_title": "8051 DAC Triangular Waveform",
      "question": "Develop an 8051 program to generate a triangular waveform using a DAC. Observe and verify it using a DSO/CRO.",
      "answer": "DAC0808 data lines on P1 (with op-amp current-to-voltage converter).\n\n  #include <reg51.h>\n  void main(void)\n  {\n          unsigned char i;\n          while (1)\n          {\n                  for (i = 0; i < 255; i++)                      // rising ramp 00H -> FEH\n                      P1 = i;\n                  for (i = 255; i > 0; i--)                      // falling ramp FFH -> 01H\n                          P1 = i;\n          }\n  }\n\nVerification: connect the DAC output to the CRO/DSO. A symmetrical triangular wave\nappears, peak amplitude about 5 V (0 to full scale). Note the period (time per division x\ndivisions), frequency = 1 / period, and the rise time equal to the fall time. Adding a small\ndelay in each loop lowers the frequency."
    },
    "part_b": {
      "sub": "ii",
      "key": "15b",
      "title": "Question 15(ii) \u2014 8085 Student Attendance Processing",
      "short_title": "8085 Student Attendance Processing",
      "question": "Create an 8085 program to process attendance records of students. The application should calculate attendance percentage, identify students below the minimum attendance requirement, and generate an eligibility status for examinations.",
      "answer": "Minimum attendance 75 percent.\n\n  ; 3000H = total classes held, 3001H = number of students\n  ; 3002H onwards = classes attended by each student\n  ; 3100H onwards = attendance percentage, 3200H onwards = status (01 =\n  eligible, 00 = detained)\n              LXI SP,27FFH\n              LDA 3001H\n              MOV C,A                           ; C = number of students\n              LXI H,3002H                       ; HL -> attended\n              LXI D,3100H                       ; DE -> percentage output\n  NEXT: MOV A,M\n              CALL PERCENT                      ; A = percentage\n              STAX D\n              CPI 4BH                           ; 75 decimal\n              MVI A,01H\n              JNC ELIG\n              MVI A,00H\n  ELIG: INR D                                   ; 31xx -> 32xx\n              STAX D                            ; store status\n              DCR D\n              INX H\n              INX D\n              DCR C\n\n              JNZ NEXT\n              HLT\n  ; --- subroutine: A = attended -> A = attended x 100 / total ---\n  PERCENT: PUSH H\n        PUSH D\n              PUSH B\n              MOV E,A\n              MVI D,00H\n              MVI B,64H                         ; 100\n              LXI H,0000H\n  MUL:        DAD D\n              DCR B\n              JNZ MUL                           ; HL = attended x 100\n              LDA 3000H\n              MOV C,A                           ; C = total classes\n              MVI B,00H                         ; B = quotient\n  DIV:        MOV A,H\n              ORA A\n              JNZ SUBT\n              MOV A,L\n              CMP C\n        JC DONE\n  SUBT: MOV A,L\n        SUB C\n              MOV L,A\n              JNC NB\n              DCR H\n  NB:         INR B\n              JMP DIV\n  DONE: MOV A,B\n        POP B\n        POP D\n              POP H\n              RET\n\nExample: total 28H (40), attended 24H (36) gives 5AH (90 percent), status 01; attended\n1EH (30) gives 4BH (75 percent), status 01; attended 14H (20) gives 32H (50 percent),\nstatus 00. Total classes must not be zero."
    }

      "question": "Write a Keil C program to configure Timer 1 and toggle an LED periodically. Verify the output timing.",
      "answer": "#include <reg51.h>\n  sbit LED = P1^0;\n  void delay_50ms(void)\n  {\n          TMOD = 0x10;                             // Timer 1, Mode 1 (16-bit)\n          TH1 = 0x4C;                              // 4C00H -> 50 ms at 11.0592 MHz\n          TL1       = 0x00;\n          TR1       = 1;\n          while (TF1 == 0);                        // wait for overflow\n          TR1 = 0;\n          TF1 = 0;\n  }\n  void main(void)\n  {\n          unsigned char i;\n          while (1)\n          {\n                  LED = ~LED;\n                  for (i = 0; i < 20; i++)                 // 20 x 50 ms = 1 s\n                          delay_50ms();\n          }\n  }\n\nVerification: in Keil, set Xtal = 11.0592 MHz (Project > Options > Target), run in the\ndebugger and open Peripherals > I/O Ports > Port 1. Watch the elapsed time (sec) in the\nRegisters window; P1.0 changes state every 1.000 s. On hardware, check with a CRO:\nperiod = 2 s, frequency = 0.5 Hz."
    },
    "part_b": {

      "key": "16b",
      "title": "Question 16(ii) \u2014 8085 5-Product Inventory Monitoring",
      "short_title": "8085 5-Product Inventory Monitoring",
      "question": "Develop an inventory monitoring application that maintains stock levels for multiple products. The program should update stock after sales, detect out-of-stock conditions, and identify products requiring replenishment.",
      "answer": "Written in 8085 assembly for five products.\n\n  ; 3000H-3004H = stock of 5 products, 3010H-3014H = quantity sold\n  ; 3020H = reorder level\n  ; 3100H-3104H = status (00 = OK, 01 = needs replenishment, 02 = out of stock)\n        LXI H,3000H       ; HL -> stock\n        LXI D,3010H                             ; DE -> sales\n        MVI C,05H\n  NEXT: LDAX D\n              MOV B,A\n              MOV A,M\n              SUB B                             ; stock - sold\n              JNC OK\n              XRA A                             ; sold more than stock -> stock = 0\n\n  OK:         MOV M,A                           ; updated stock\n              ORA A\n              JZ OUTST\n              LDA 3020H\n              MOV B,A\n              MOV A,M\n              CMP B                             ; stock - reorder level\n              JC REORD\n              MVI A,00H\n        JMP STORE\n  OUTST: MVI A,02H\n        JMP STORE\n  REORD: MVI A,01H\n  STORE: INR H                                  ; 30xx -> 31xx\n        MOV M,A\n              DCR H\n              INX H\n              INX D\n              DCR C\n              JNZ NEXT\n              HLT\n\nExample: stock 0A, sold 03, reorder level 05 gives stock 07, status 00; stock 06, sold 03\ngives stock 03, status 01; stock 04, sold 04 gives stock 00, status 02."
    }

      "title": "Question 17(i) \u2014 8051 Serial UART Echo & LEDs",
      "short_title": "8051 Serial UART Echo & LEDs",
      "question": "Develop a Keil C program to receive a character through the serial port and transmit the same character back. Verify using a serial terminal.",
      "answer": "#include <reg51.h>\n  void main(void)\n  {\n          unsigned char ch;\n          TMOD = 0x20;                          // Timer 1, Mode 2 (auto-reload) for baud rate\n          TH1 = 0xFD;                           // 9600 baud at 11.0592 MHz\n          SCON = 0x50;                          // Mode 1 (8-bit UART), REN = 1\n          TR1 = 1;\n          while (1)\n          {\n                  while (RI == 0);                   // wait for a character\n                  ch = SBUF;\n                  RI = 0;\n                  SBUF = ch;                         // send it back\n                  while (TI == 0);\n                  TI = 0;\n          }\n  }\n\nVerification: connect the 8051 to the PC through a MAX232 / USB-serial adapter, open a\nterminal (Putty, Tera Term, or the Keil Serial Window UART#1) at 9600 baud, 8 data bits, no\nparity, 1 stop bit. Every key typed appears again on the screen because the 8051 echoes it."

    "part_b": {

      "key": "17b",
      "title": "Question 17(ii) \u2014 8085 Patient Priority Sorting (Emergency)",
      "short_title": "8085 Patient Priority Sorting (Emergency)",
      "question": "Design an 8085 program to process patient priority values stored in memory. The application should sort patients based on priority and identify the patient requiring immediate attention.",
      "answer": "Higher number = higher priority. At least 2 patients.\n\n  ; 3000H = number of patients, 3001H onwards = priority values\n  ; 3100H = highest priority value, 3101H = patient number needing immediate\n  attention\n  ; After the program, 3001H onwards holds priorities sorted in descending\n  order\n        LDA 3000H\n              MOV C,A\n              LXI H,3001H\n              MOV B,M                           ; B = highest priority so far\n              MVI D,01H                         ; D = its patient number\n              MVI E,01H                         ; E = current patient number\n        DCR C\n  FIND: INX H\n        INR E\n              MOV A,M\n              CMP B\n              JC      FN\n\n              JZ FN\n              MOV B,A\n              MOV D,E\n  FN:         DCR C\n              JNZ FIND\n              MOV A,B\n              STA 3100H\n              MOV A,D\n              STA 3101H                         ; patient requiring immediate attention\n              LDA 3000H                         ; bubble sort, descending\n              DCR A\n        MOV D,A                                 ; D = number of passes\n  OUTER: LXI H,3001H\n        MOV C,D\n  INNER: MOV A,M\n        INX H\n              CMP M\n              JNC NOSW                          ; current >= next -> no swap\n              MOV B,M\n              MOV M,A\n              DCX H\n              MOV M,B\n        INX H\n  NOSW: DCR C\n              JNZ INNER\n              DCR D\n              JNZ OUTER\n              HLT\n\nExample: priorities 03, 09, 05, 01 give 3100H = 09, 3101H = 02, and the sorted list 09, 05, 03,\n01."
    }

        const terminalBody = document.getElementById('terminal-body');
        const cmdInput = document.getElementById('cmd-input');
        let commandHistory = [];
        let historyIndex = -1;

        // Escape HTML characters safely
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Copy raw text reliably to clipboard
        function copyTextToClipboard(text, btnElement) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const orig = btnElement.textContent;
                    btnElement.textContent = '[Copied!]';
                    btnElement.classList.add('bg-white', 'text-black');
                    setTimeout(() => {
                        btnElement.textContent = orig;
                        btnElement.classList.remove('bg-white', 'text-black');
                    }, 1500);
                }
                return true;
            } catch (err) {
                return false;
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Copy specific subdivision by question number and part ('a' for i, 'b' for ii)
        function copySubdivisionCode(qNum, partLetter, btnId) {
            const q = questionsDB[String(qNum)];
            if (!q) return;
            const part = (partLetter === 'b' || partLetter === 'ii' || partLetter === '2') ? q.part_b : q.part_a;
            const btn = btnId ? document.getElementById(btnId) : null;
            copyTextToClipboard(part.answer, btn);
        }

        // Render classic Windows CMD + 8085/8051 Startup Banner
        function renderWelcomeBanner() {
            const bannerHTML = `
                <div class="text-[#cccccc] whitespace-pre-wrap leading-snug">Microsoft Windows [Version 10.0.19045.5011]
(c) Microsoft Corporation. All rights reserved.

C:\Users\Administrator&gt;8085_8051_lab.exe
Microprocessor &amp; Microcontroller Practical Laboratory Environment Ready.
All 20 Questions (40 Subdivisions) Loaded Directly from Official Practical Guide.

COMMANDS:
  * Type question number 1-20 (e.g. '1', '9') to view both (i) and (ii) with separate copy buttons.
  * Type '1a' or '1i' for subdivision (i) only; '1b' or '1ii' for subdivision (ii) only.
  * Type 'cp 1a' or 'cp 1b' to copy that subdivision's code directly to clipboard.
  * Type 'ls' or 'dir' to list all 20 questions in an ASCII table.
  * Type 'cls' to clear screen.</div>
            `;
            appendOutputBlock(bannerHTML);
        }

        // Append echoed C:\Users\Administrator> command line
        function appendCommandEcho(rawCmd) {
            const cmdLine = document.createElement('div');
            cmdLine.className = "text-[#cccccc] whitespace-pre-wrap pt-1";
            cmdLine.innerHTML = `C:\Users\Administrator&gt; <span class="text-[#ffffff]">${escapeHtml(rawCmd)}</span>`;
            terminalBody.appendChild(cmdLine);
        }

        // Append arbitrary HTML block to terminal stream
        function appendOutputBlock(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent;
            terminalBody.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        // Render one subdivision card
        function renderSubdivisionCard(part, qNum) {
            const uniqueBtnId = `copy-btn-${part.key}-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
            return `
                <div class="my-2 border border-[#555555] bg-black p-3">
                    <!-- Header with Title and Independent Copy Button -->
                    <div class="flex items-center justify-between border-b border-[#444444] pb-1.5 mb-2 text-xs sm:text-sm text-[#cccccc]">
                        <span class="font-bold text-white">// ${escapeHtml(part.title)}</span>
                        <button 
                            id="${uniqueBtnId}"
                            onclick="copySubdivisionCode('${qNum}', '${part.key.slice(-1)}', '${uniqueBtnId}')" 
                            class="text-[#ffffff] hover:bg-[#cccccc] hover:text-black px-2 py-0.5 border border-[#777777] text-xs cursor-pointer select-none font-bold transition"
                            title="Copy (${part.sub}) code to clipboard"
                        >[Copy (${part.sub})]</button>
                    </div>

                    <!-- Question prompt block -->
                    <div class="text-[#88ccff] text-xs sm:text-sm mb-3 whitespace-pre-wrap leading-normal font-sans bg-[#0c131a] p-2 border-l-2 border-[#2b7fff]">
                        <span class="text-[#2b7fff] font-bold select-none">[Q (${part.sub})] </span>${escapeHtml(part.question)}
                    </div>

                    <!-- Full unshortened answer code and notes from PDF -->
                    <pre class="text-[#ffffff] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-relaxed select-all font-mono"><code>${escapeHtml(part.answer)}</code></pre>
                </div>
            `;
        }

        // Render full question (both subdivisions i and ii separately)
        function renderFullQuestion(qNum) {
            const q = questionsDB[String(qNum)];
            if (!q) return '';
            const cardA = renderSubdivisionCard(q.part_a, qNum);
            const cardB = renderSubdivisionCard(q.part_b, qNum);
            return `
                <div class="my-2">
                    <div class="text-[#aaaaaa] text-xs sm:text-sm font-bold border-b border-[#333333] pb-1 mb-1">
                        ══════ QUESTION ${qNum} : ${escapeHtml(q.part_a.short_title)} &amp; ${escapeHtml(q.part_b.short_title)} ══════
                    </div>
                    ${cardA}
                    ${cardB}
                </div>
            `;
        }

        // Render ASCII Table List of all 20 Questions with both subdivisions
        function renderExperimentList() {
            let rows = '';
            for (let q = 1; q <= 20; q++) {
                const item = questionsDB[String(q)];
                const paddedNum = String(q).padEnd(3, ' ');
                const textPart = `(i) ${item.part_a.short_title} | (ii) ${item.part_b.short_title}`;
                const paddedText = textPart.padEnd(80, ' ').slice(0, 80);
                rows += `| ${paddedNum} | ${escapeHtml(paddedText)} |
`;
            }

            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+-----+----------------------------------------------------------------------------------+
| Q#  | Question Title (8085 &amp; 8051 Practical - All Subdivisions)                        |
+-----+----------------------------------------------------------------------------------+
${rows}+-----+----------------------------------------------------------------------------------+
20 questions loaded (40 subdivisions total).
Commands: type 1-20 (or 1a, 1b) to view, cp &lt;1a / 1b / 1&gt; to copy, cls to clear.</pre>
            `;
        }

        // Normalize input string
        function normalizeKey(str) {
            return str.replace(/[\.\(\)\-]/g, '').toLowerCase().trim();
        }

        // Main command router
        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            // Record command history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Strip trailing semicolon
            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();
            const norm = normalizeKey(lower);

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === 'exit') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Check single subdivision commands: "1a", "1i", "1.1", "q1a", "q1i"
            const subMatch = norm.match(/^(?:exp|experiment|ex|q|question)?\s*([0-9]{1,2})\s*([ab]|i{1,2}|1|2)$/);
            if (subMatch) {
                const qNum = subMatch[1];
                const subKey = subMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const isPartB = (subKey === 'b' || subKey === 'ii' || subKey === '2');
                    const part = isPartB ? q.part_b : q.part_a;
                    appendOutputBlock(renderSubdivisionCard(part, qNum));
                    return;
                }
            }

            // Check full question commands: "1", "q1", "exp 1"
            const fullMatch = norm.match(/^(?:exp|experiment|ex|q|question)?\s*([0-9]{1,2})$/);
            if (fullMatch) {
                const qNum = fullMatch[1];
                if (questionsDB.hasOwnProperty(qNum)) {
                    appendOutputBlock(renderFullQuestion(qNum));
                    return;
                }
            }

            // List all questions
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === '?') {
                appendOutputBlock(renderExperimentList());
                return;
            }

            // Copy command: "copy 1a", "cp 1a", "cp 1i", "cp 1b", "cp 1ii"
            const copySubMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})\s*[\.\(\)\-]?\s*([ab]|i{1,2}|1|2)$/);
            if (copySubMatch) {
                const qNum = copySubMatch[1];
                const subKey = copySubMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const isPartB = (subKey === 'b' || subKey === 'ii' || subKey === '2');
                    const part = isPartB ? q.part_b : q.part_a;
                    const ok = copyTextToClipboard(part.answer, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${qNum}(${part.sub}) code copied to clipboard successfully.</div>`);
                    }
                    return;
                }
            }

            // Copy whole question: "copy 1" or "cp 1"
            const copyFullMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})$/);
            if (copyFullMatch) {
                const qNum = copyFullMatch[1];
                const q = questionsDB[qNum];
                if (q) {
                    const combined = `// ${q.part_a.title}
${q.part_a.answer}

// ${q.part_b.title}
${q.part_b.answer}`;
                    const ok = copyTextToClipboard(combined, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${qNum} (both parts i &amp; ii) copied to clipboard. Tip: use 'cp ${qNum}a' or 'cp ${qNum}b' for individual parts.</div>`);
                    }
                    return;
                }
            }

            // All questions at once (1 to 20)
            if (lower === 'all') {
                for (let i = 1; i <= 20; i++) {
                    appendOutputBlock(renderFullQuestion(i));
                }
                return;
            }

            // Unknown command fallback
            appendOutputBlock(`
                <div class="text-[#cccccc] whitespace-pre-wrap">'${escapeHtml(trimmed)}' is not recognized as an internal or external command.
Type '1'-'20' (or '1a', '1b') to view questions, 'ls' to list, 'cp &lt;1a / 1b / 1&gt;' to copy, or 'cls' to clear.</div>
            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();
        }

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep input focused when clicking terminal background unless selecting code text
        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }

        // Initialize Terminal on Load
        window.onload = () => {
            renderWelcomeBanner();
            cmdInput.focus();
        };
    </script>
