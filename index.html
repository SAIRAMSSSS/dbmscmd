class CircularSpooler:
    def __init__(self, size=3):
        self.size = size
        self.q = [None] * size
        self.front = self.rear = -1

    def add_job(self, job):
        if (self.rear + 1) % self.size == self.front:
            print(f"Queue Full! Cannot add '{job}'")
            return
        if self.front == -1:
            self.front = 0
        self.rear = (self.rear + 1) % self.size
        self.q[self.rear] = job
        print(f"Added job: {job}")

    def print_next_job(self):
        if self.front == -1:
            print("Queue Empty! No jobs to print.")
            return
        job = self.q[self.front]
        if self.front == self.rear:
            self.front = self.rear = -1
        else:
            self.front = (self.front + 1) % self.size
        print(f"Printing: {job}")

    def display_pending(self):
        if self.front == -1:
            print("No pending jobs.")
            return
        i = self.front
        jobs = []
        while True:
            jobs.append(self.q[i])
            if i == self.rear:

                        code: `def infix_to_postfix(expr):
    prec = {'+': 1, '-': 1, '*': 2, '/': 2, '^': 3}
    stack = []
    output = []
    for ch in expr.replace(" ", ""):
        if ch.isalnum():
            output.append(ch)
        elif ch == '(':
            stack.append(ch)
        elif ch == ')':
            while stack and stack[-1] != '(':
                output.append(stack.pop())
            stack.pop()
        else:
            while stack and stack[-1] != '(' and prec.get(stack[-1], 0) >= prec[ch]:
                if ch == '^' and stack[-1] == '^':
                    break # '^' is right-associative
                output.append(stack.pop())
            stack.append(ch)
    while stack:
        output.append(stack.pop())
    return "".join(output)

print("Postfix of A+B*C:", infix_to_postfix("A+B*C"))`

def top_5_leaderboard(stream):
    min_heap = []

    return min_heap

def max_heapify(arr, n, i):
    largest = i
    l, r = 2 * i + 1, 2 * i + 2
    if l < n and arr[l] > arr[largest]: largest = l
    if r < n and arr[r] > arr[largest]: largest = r
    if largest != i:
        arr[i], arr[largest] = arr[largest], arr[i]
        max_heapify(arr, n, largest)

    for i in range(n // 2 - 1, -1, -1):

def top_5_leaderboard(stream):
    min_heap = []
    for score in stream:
        if len(min_heap) < 5:
            heapq.heappush(min_heap, score)
        elif score > min_heap[0]:
            heapq.heapreplace(min_heap, score)
        print(f"After score {score:>3} -> Top-5 Min-Heap: {min_heap}")
    return min_heap

def max_heapify(arr, n, i):
    largest = i
    l, r = 2 * i + 1, 2 * i + 2
    if l < n and arr[l] > arr[largest]: largest = l
    if r < n and arr[r] > arr[largest]: largest = r
    if largest != i:
        arr[i], arr[largest] = arr[largest], arr[i]
        max_heapify(arr, n, largest)

def heap_sort_using_max_heap(arr):
    n = len(arr)
    for i in range(n // 2 - 1, -1, -1):

    for i in range(n - 1, 0, -1):

class AVLTree:
    def height(self, node):
        return node.height if node else 0

    def balance_factor(self, node):
        return self.height(node.left) - self.height(node.right) if node else 0

    # Right Rotation (Used in LL and RL cases)
    def right_rotate(self, y):
        x = y.left
        T2 = x.right
        x.right = y
        y.left = T2
        y.height = 1 + max(self.height(y.left), self.height(y.right))
        x.height = 1 + max(self.height(x.left), self.height(x.right))
        return x

    # Left Rotation (Used in RR and LR cases)
    def left_rotate(self, x):
        y = x.right
        T2 = y.left
        y.left = x
        x.right = T2
        x.height = 1 + max(self.height(x.left), self.height(x.right))
        y.height = 1 + max(self.height(y.left), self.height(y.right))
        return y

    def insert(self, root, key):
        if not root:
            return AVLNode(key)
        if key < root.key:
            root.left = self.insert(root.left, key)
        elif key > root.key:
            root.right = self.insert(root.right, key)
        else:
            return root

        root.height = 1 + max(self.height(root.left), self.height(root.right))
        bf = self.balance_factor(root)

        # 1. LL Case -> Single Right Rotation
        if bf > 1 and key < root.left.key:
            return self.right_rotate(root)
        # 2. RR Case -> Single Left Rotation
        if bf < -1 and key > root.right.key:
            return self.left_rotate(root)
        # 3. LR Case -> Left Rotate child, then Right Rotate root
        if bf > 1 and key > root.left.key:
            root.left = self.left_rotate(root.left)
            return self.right_rotate(root)
        # 4. RL Case -> Right Rotate child, then Left Rotate root
        if bf < -1 and key < root.right.key:
            root.right = self.right_rotate(root.right)
            return self.left_rotate(root)

            activeSetObj.listItems.forEach(([cmd, title]) => {
                const paddedKey = cmd.padEnd(4, ' ');
                const paddedTitle = title.padEnd(66, ' ');
                rows += `| ${paddedKey} | ${escapeHtml(paddedTitle)} |\n`;
            });

            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+------+--------------------------------------------------------------------+
| Cmd  | ${escapeHtml(activeSetObj.name.padEnd(66, ' '))} |
+------+--------------------------------------------------------------------+
${rows}+------+--------------------------------------------------------------------+
Switch sets: 's1' (Set 1) or 's2' (Set 2). View code: '1'-'10' (or '1a'/'1b'). Copy: 'cp &lt;num&gt;'.</pre>
            `;
        }

        function renderHostGuide() {
            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-snug">+--------------------------------------------------------------------+
| FREE CUSTOM DOMAIN HOSTING GUIDE                                   |
+--------------------------------------------------------------------+
1. Save this code as index.html inside an empty folder.
2. Open https://app.netlify.com/drop in your browser.
3. Drag and drop the folder onto the page.
4. Go to Site Configuration -> Change site name -> set an easy name
   such as: dsalab.netlify.app</pre>
            `;
        }

        // Normalize key (e.g., "1.a" -> "1a", "1(i)" -> "1a", "1(ii)" -> "1b", "1i" -> "1a", "1ii" -> "1b")
        function normalizeKey(str) {
            let s = str.replace(/\./g, '').replace(/\s+/g, '').toLowerCase();
            s = s.replace(/\(ii\)|ii$/g, 'b').replace(/\(i\)|i$/g, 'a');
            return s;
        }

        function switchSet(newSet) {
            currentSet = newSet;
            const label = newSet === 's1' ? 'SET 1' : 'SET 2';
            titleBarText.textContent = `Command Prompt - python -i [${label}]`;
            appendOutputBlock(`<div class="text-[#cccccc]">Switched to <strong>${setsData[newSet].name}</strong>. Type <strong>1</strong>-<strong>10</strong> (or <strong>1a</strong>, <strong>1b</strong>) to get ${label} programs, or <strong>ls</strong> to view the list.</div>`);
        }

        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === 'exit()') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Switch to Set 1 or Set 2 ("s1", "set1", "set 1", "s2", "set2", "set 2")
            if (lower === 's1' || lower === 'set1' || lower === 'set 1') {
                switchSet('s1');
                return;
            }
            if (lower === 's2' || lower === 'set2' || lower === 'set 2') {
                switchSet('s2');
                return;
            }

            // Direct inline set + question query, e.g., "s1 3", "s2 10", "s1 5a"
            const directSetMatch = lower.match(/^(s1|set1|s2|set2)\s+(.+)$/);
            if (directSetMatch) {
                const targetSet = directSetMatch[1].includes('1') ? 's1' : 's2';
                currentSet = targetSet;
                titleBarText.textContent = `Command Prompt - python -i [${targetSet === 's1' ? 'SET 1' : 'SET 2'}]`;
                const subKey = normalizeKey(directSetMatch[2]);
                if (experimentGroups.hasOwnProperty(subKey)) {
                    const blocksHtml = experimentGroups[subKey].map(k => renderExperimentBlock(currentSet, k)).join('');
                    appendOutputBlock(blocksHtml);
                    return;
                }
                if (setsData[currentSet].experiments.hasOwnProperty(subKey)) {
                    appendOutputBlock(renderExperimentBlock(currentSet, subKey));
                    return;
                }
            }

            const norm = normalizeKey(lower);
            const activeExperiments = setsData[currentSet].experiments;

            // Check grouped question number (1-10) -> outputs both i (a) & ii (b)
            if (experimentGroups.hasOwnProperty(norm)) {
                const keys = experimentGroups[norm];
                const blocksHtml = keys.map(k => renderExperimentBlock(currentSet, k)).join('');
                appendOutputBlock(blocksHtml);
                return;
            }

            // Check individual sub-question (1a, 1b, 2a, 2b, 10a, 10b, etc.)
            if (activeExperiments.hasOwnProperty(norm)) {
                appendOutputBlock(renderExperimentBlock(currentSet, norm));
                return;
            }

            // Support "exp 1", "q1", "ex 1a", etc.
            const expMatch = norm.match(/^(?:exp|experiment|ex|q|question)\s*([0-9]{1,2}[ab]?)$/);
            if (expMatch) {
                const target = expMatch[1];
                if (experimentGroups.hasOwnProperty(target)) {
                    const blocksHtml = experimentGroups[target].map(k => renderExperimentBlock(currentSet, k)).join('');
                    appendOutputBlock(blocksHtml);
                    return;
                }
                if (activeExperiments.hasOwnProperty(target)) {
                    appendOutputBlock(renderExperimentBlock(currentSet, target));
                    return;
                }
            }

            // List all questions in current set
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === 'help()' || lower === '?') {
                appendOutputBlock(renderExperimentList(currentSet));
                return;
            }

            // Copy command: "copy <1-10>" or "cp <1a>"
            const copyMatch = lower.match(/^(?:copy|cp)\s+(.+)$/);
            if (copyMatch) {
                const targetKey = normalizeKey(copyMatch[1]);
                if (experimentGroups.hasOwnProperty(targetKey)) {
                    const combinedCode = experimentGroups[targetKey]
                        .map(k => `# ${activeExperiments[k].title}\n${activeExperiments[k].code}`)
                        .join('\n\n');
                    const ok = copyTextToClipboard(combinedCode, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Copied ${setsData[currentSet].name} Q${targetKey} (i &amp; ii) to clipboard.</div>`);
                    }
                    return;
                }
                if (activeExperiments.hasOwnProperty(targetKey)) {
                    const ok = copyTextToClipboard(activeExperiments[targetKey].code, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Copied ${activeExperiments[targetKey].title} to clipboard.</div>`);
                    }
                    return;
                }
            }

            // All questions in current set at once (1 to 10)
            if (lower === 'all') {
                for (let i = 1; i <= 10; i++) {
                    const keys = experimentGroups[String(i)];
                    keys.forEach(k => appendOutputBlock(renderExperimentBlock(currentSet, k)));
                }
                return;
            }

            // Free hosting guide
            if (lower === 'host' || lower === 'domain' || lower === 'deploy') {
                appendOutputBlock(renderHostGuide());
                return;
            }

            // Unknown command fallback mimicking Python NameError
            appendOutputBlock(`
                <div class="text-[#cccccc] whitespace-pre-wrap">Traceback (most recent call last):
  File "&lt;stdin&gt;", line 1, in &lt;module&gt;
NameError: name '${escapeHtml(trimmed)}' is not defined. Type 's1' or 's2' to switch sets, '1'-'10' for programs, 'ls' to list, 'cp &lt;num&gt;' to copy, or 'cls' to clear.</div>
            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();
        }

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }

        window.onload = () => {
            renderWelcomeBanner();
            cmdInput.focus();
        };
    </script>
</body>
</html>
