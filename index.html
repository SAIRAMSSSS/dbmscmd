import os
import platform
import subprocess
from datetime import datetime
import customtkinter as ctk
from complaint_categories import (ADDRESSEE_TITLES, CATEGORY_NAMES, COMPLAINT_CATEGORIES,
                                  ID_PROOF_TYPES, PARENT_RELATION_TYPES, RELATIONS)
from pdf_generator import compose_letter_text, generate_pdf

ACCENT, OK, ERR = "#2563eb", "#22c55e", "#ef4444"
BG, CARD, TEXT, MID = "#ffffff", "#f1f5f9", "#0f172a", "#64748b"
FONT = "Segoe UI"
SAVE = os.path.join(os.path.expanduser("~"), ".complaint_generator_autosave.json")

STEPS = [
    ("Your Details", "Tell us about yourself - this appears in the complaint letter.", [
        ("complainant_name", "Full Name", True, "entry", None),
        ("parent_relation", "Relation", False, "option", PARENT_RELATION_TYPES),

    ("Incident Details", "Describe what happened - date, time, and location.", [
        ("incident_date", "Date of Incident", True, "entry", None),
        ("incident_time", "Time (approx.)", False, "entry", None),
        ("incident_location", "Location of Incident", True, "entry", None),
        ("category", "Complaint Category", True, "combo", CATEGORY_NAMES),
        ("narrative", "Detailed Narrative", True, "text", None)]),
    ("Accused Details", "Optional - fill in if you know details about the accused.", [
        ("accused_name", "Name of Accused", False, "entry", None),
        ("accused_address", "Address of Accused", False, "text", None),
        ("accused_description", "Physical Description", False, "entry", None),
        ("accused_relation", "Relation to You", False, "option", RELATIONS)]),
    ("Addressee", "Who should this complaint be addressed to?", [
        ("addressee_title", "Title / Designation", True, "combo", ADDRESSEE_TITLES),
        ("station_name", "Police Station / Office Name", True, "entry", None),
        ("station_address", "Station / Office Address", False, "text", None)]),
    ("Review & Generate", "Review the letter below. Go back to any step to edit.", []),
]

ctk.set_appearance_mode("light")

class App(ctk.CTk):
    def __init__(self):
        super().__init__()
        self.title("Police Complaint Generator")
        self.geometry("920x700")
        self.configure(fg_color=BG)
        self.step, self.data, self.w, self.err, self.vars = 0, {}, {}, {}, {}
        self._load()
        self._layout()

    def _layout(self):
        hdr = ctk.CTkFrame(self, fg_color=CARD, corner_radius=0, height=56)
        hdr.pack(fill="x")
        ctk.CTkLabel(hdr, text="Police Complaint Generator", text_color=TEXT,
                     font=ctk.CTkFont(FONT, 18, "bold")).pack(side="left", padx=20, pady=12)
        self.lbl_step = ctk.CTkLabel(hdr, text="", text_color=MID)
        self.lbl_step.pack(side="right", padx=20)
        bar = ctk.CTkFrame(self, fg_color=BG)
        bar.pack(fill="x", pady=(8, 0))
        self.dots = [ctk.CTkButton(bar, text=str(i + 1), width=32, height=32,
                                   corner_radius=16, command=lambda i=i: self._jump(i))
                     for i in range(len(STEPS))]
        for dot in self.dots:
            dot.pack(side="left", padx=6, pady=4)
        self.body = ctk.CTkScrollableFrame(self, fg_color=BG)
        self.body.pack(fill="both", expand=True, padx=24, pady=(8, 4))
        nav = ctk.CTkFrame(self, fg_color=BG)
        nav.pack(fill="x", padx=24, pady=(4, 16))
        self.btn_back = ctk.CTkButton(nav, text="Back", width=120, height=42,
                                      fg_color=CARD, text_color=TEXT, command=self._back)
        self.btn_next = ctk.CTkButton(nav, text="Continue", width=160, height=42,
                                      fg_color=ACCENT, command=self._next)
        self.btn_back.pack(side="left")
        self.btn_next.pack(side="right")
        self._show(self.step)

    def _show(self, i):
        self.step = i
        for child in self.body.winfo_children():
            child.destroy()
        title, subtitle, fields = STEPS[i]
        self.w, self.err = {}, {}
        self._label(title, 20, True)
        self._label(subtitle, 12, color=MID)
        for field in fields:
            widget = self._field(*field)
            if field[0] == "category":
                self.sec = ctk.CTkFrame(self.body, fg_color=CARD)
                self.sec.pack(fill="x", pady=8)
                widget.configure(command=self._sections)
                self._sections()
        if i == len(STEPS) - 1:
            box = ctk.CTkTextbox(self.body, height=420, fg_color=CARD,
                                 font=ctk.CTkFont("Consolas", 11))
            box.insert("1.0", compose_letter_text(self.data))
            box.configure(state="disabled")
            box.pack(fill="both", expand=True)
        for k, dot in enumerate(self.dots):
            dot.configure(fg_color=ACCENT if k == i else OK if k < i else CARD,
                          text_color="white" if k <= i else MID)
        self.lbl_step.configure(text=f"Step {i + 1} of {len(STEPS)} - {title}")
        last = i == len(STEPS) - 1
        self.btn_back.configure(state="normal" if i else "disabled")
        self.btn_next.configure(text="Generate PDF" if last else "Continue",
                                fg_color=OK if last else ACCENT)
        self._save()

    def _next(self):
        if self._validate():
            self._collect()
            if self.step < len(STEPS) - 1:
                self._show(self.step + 1)
            else:
                self._generate()

    def _back(self):
        self._collect()
        self._show(self.step - 1)

    def _jump(self, i):
        if i < self.step:
            self._collect()
            self._show(i)
        elif i == self.step + 1:
            self._next()

    def _label(self, text, size=12, bold=False, color=TEXT, anchor="w"):
        ctk.CTkLabel(self.body, text=text, text_color=color, wraplength=700,
                     font=ctk.CTkFont(FONT, size, "bold" if bold else "normal")
                     ).pack(anchor=anchor, pady=(0, 6))

    def _field(self, key, label, required, kind, options):
        frame = ctk.CTkFrame(self.body, fg_color="transparent")
        frame.pack(fill="x", pady=6)
        ctk.CTkLabel(frame, text=label + (" *" if required else ""), text_color=TEXT,
                     font=ctk.CTkFont(FONT, 12, "bold")).pack(anchor="w")
        if kind == "entry":
            w = ctk.CTkEntry(frame, height=38, fg_color=CARD)
        elif kind == "text":
            w = ctk.CTkTextbox(frame, height=70, fg_color=CARD)
        elif kind == "combo":
            w = ctk.CTkComboBox(frame, values=options, height=38, fg_color=CARD)
        else:
            w = ctk.CTkOptionMenu(frame, values=options, height=38, fg_color=CARD,
                                  text_color=TEXT)
        w.pack(fill="x", pady=(4, 0))
        value = self.data.get(key, options[0] if options else "")
        if isinstance(w, ctk.CTkTextbox):
            w.insert("1.0", value)
        elif isinstance(w, ctk.CTkEntry):
            w.insert(0, value)
        else:
            w.set(value)
        self.err[key] = ctk.CTkLabel(frame, text="", text_color=ERR)
        self.err[key].pack(anchor="w")
        self.w[key] = w
        return w

    def _sections(self, _choice=None):
        info = COMPLAINT_CATEGORIES.get(self.w["category"].get(), {})
        for child in self.sec.winfo_children():
            child.destroy()
        ctk.CTkLabel(self.sec, text=info.get("description", ""), text_color=MID
                     ).pack(anchor="w", padx=12, pady=6)
        chosen = self.data.get("selected_sections", [])
        self.vars = {s: ctk.BooleanVar(value=s in chosen)
                     for s in info.get("sections", [])}
        for text, var in self.vars.items():
            ctk.CTkCheckBox(self.sec, text=text, variable=var, text_color=TEXT,
                            fg_color=ACCENT).pack(anchor="w", padx=20, pady=2)

    @staticmethod
    def _get(w):
        return w.get("1.0", "end-1c") if isinstance(w, ctk.CTkTextbox) else w.get()

    def _validate(self):
        ok = True
        for key, label, required, *_ in STEPS[self.step][2]:
            missing = required and not self._get(self.w[key]).strip()
            self.err[key].configure(text=f"{label} is required" if missing else "")
            ok = ok and not missing
        return ok

    def _collect(self):
        self.data.update({k: self._get(w) for k, w in self.w.items()})
        if self.step == 1:
            self.data["selected_sections"] = [s for s, v in self.vars.items() if v.get()]

    def _generate(self):
        folder = os.path.join(os.path.expanduser("~"), "Downloads")
        if not os.path.isdir(folder):
            folder = os.path.expanduser("~")
        stamp = datetime.now().strftime("%Y%m%d_%H%M%S")
        path = os.path.join(folder, f"Complaint_{stamp}.pdf")
        try:
            self._success(generate_pdf(self.data, path))
        except Exception as exc:
            self._label(f"PDF generation failed: {exc}", color=ERR)

    def _success(self, path):
        for child in self.body.winfo_children():
            child.destroy()
        self._label("✓", 64, color=OK, anchor="center")
        self._label("PDF Generated Successfully!", 22, True, anchor="center")
        self._label(f"Saved to: {path}", color=MID, anchor="center")
        row = ctk.CTkFrame(self.body, fg_color="transparent")
        row.pack(pady=12)
        ctk.CTkButton(row, text="Open PDF", width=160, height=42,
                      command=lambda: self._open(path)).pack(side="left", padx=8)
        ctk.CTkButton(row, text="Open Folder", width=160, height=42, fg_color=CARD,
                      text_color=TEXT, command=lambda: self._open(os.path.dirname(path))
                      ).pack(side="left", padx=8)
        ctk.CTkButton(self.body, text="Start New Complaint", width=200, height=42,
                      fg_color="transparent", border_width=1, border_color=ACCENT,
                      text_color=ACCENT, command=self._reset).pack(pady=12)
        self.btn_back.pack_forget()
        self.btn_next.pack_forget()

    @staticmethod
    def _open(target):
        target = os.path.normpath(target)
        if platform.system() == "Windows":
            os.startfile(target)
        else:
            tool = "open" if platform.system() == "Darwin" else "xdg-open"
            subprocess.Popen([tool, target])

    def _reset(self):
        self.data, self.step = {}, 0
        if os.path.exists(SAVE):
            os.remove(SAVE)
        for child in self.winfo_children():
            child.destroy()
        self._layout()

    def _save(self):
        try:
            with open(SAVE, "w", encoding="utf-8") as f:
                json.dump({"data": self.data, "step": self.step}, f)
        except OSError:
            pass

    def _load(self):
        try:
            with open(SAVE, encoding="utf-8") as f:
                saved = json.load(f)
            self.data, self.step = saved.get("data", {}), saved.get("step", 0)
        except (OSError, ValueError):
            pass

if __name__ == "__main__":

def _style(name, **kw):

def _letter(d):
    g = lambda k, default="": escape((d.get(k) or default).strip())
    name, phone = g("complainant_name", "________"), g("phone")
    place = g("complainant_address").split(",")[-1].strip() or "________"
    p = [("right", f"Date: {datetime.now():%d %B %Y}"), ("right", f"Place: {place}"),
         ("gap", 16), ("left", "To,"),
         ("left", f"<b>{g('addressee_title', 'The Station House Officer')}</b>,")]
    if g("station_name"):
        p.append(("left", g("station_name") + ","))
    if g("station_address"):
        p.append(("left", g("station_address")))
    p += [("gap", 10),
          ("bold", f"Subject: Complaint regarding {g('category', 'General Complaint')}"),
          ("rule", ""), ("body", "Respected Sir/Madam,")]
    intro = f"I, <b>{name}</b>"
    if g("parent_guardian_name"):
        intro += f", {g('parent_relation', 'S/o')} <b>{g('parent_guardian_name')}</b>"
    intro += f", a resident of {g('complainant_address', '________')}"
    if phone:
        intro += f" (Contact: {phone})"
    p.append(("body", intro + ", do hereby respectfully submit this complaint "
                              "for your kind attention and necessary action."))
    when = f" at approximately <b>{g('incident_time')}</b>" if g("incident_time") else ""
    p.append(("body", "I wish to bring to your notice the following incident that took "
                      f"place on <b>{g('incident_date', '________')}</b>{when} at "
                      f"<b>{g('incident_location', '________')}</b>."))
    p += [("body", ln.strip()) for ln in g("narrative").splitlines() if ln.strip()]
    sections = d.get("selected_sections") or []
    if sections:
        p.append(("bold", "The above acts may attract the following provisions of law:"))
        p += [("item", f"• {escape(s)}") for s in sections]
    if g("accused_name"):
        p.append(("bold", "Details of the accused / respondent:"))
        for label, key in (("Name", "accused_name"), ("Address", "accused_address"),
                           ("Description", "accused_description"),
                           ("Relation to complainant", "accused_relation")):
            if g(key):
                p.append(("item", f"{label}: {g(key)}"))
    p += [("body", "In view of the above facts and circumstances, I humbly request you "
                   "to kindly register my complaint, investigate the matter, and take "
                   "necessary action as per law. I shall be grateful for your prompt "
                   "intervention."),
          ("body", "Thanking you,"), ("body", "Yours faithfully,"),
          ("sign", f"({name})")]
    for label, key in (("Phone", "phone"), ("Email", "email")):
        if g(key):
            p.append(("body", f"{label}: {g(key)}"))
    if g("id_proof_type") and g("id_proof_number"):
        p.append(("body", f"ID Proof: {g('id_proof_type')} - {g('id_proof_number')}"))
    return p

def compose_letter_text(data):
    out = ""
    for kind, text in _letter(data):
        if kind == "gap":
            out += "\\n"
        elif kind != "rule":
            if kind in ("body", "bold", "sign") and not out.endswith("\\n\\n"):
                out += "\\n"
            out += unescape(re.sub(r"<[^>]+>", "", text)) + "\\n"
    return out.strip()

        // Copy raw Python text reliably inside iframe or browser

            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';

            document.body.appendChild(textarea);
            textarea.select();
            try {

                    const originalText = btnElement.textContent;
                    btnElement.textContent = '[Copied]';
                    setTimeout(() => {

                return true;

        // Normalize key (e.g., "1.a" -> "1a")
        function normalizeKey(str) {
            return str.replace(/\./g, '').toLowerCase();
        }

        // Main command router
        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            // Record command history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Strip trailing semicolon if user types "1;" or "ls;"
            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();
            const norm = normalizeKey(lower);

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === 'exit()') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Check grouped experiment number (1-11 or 'project') -> outputs both a & b
            if (experimentGroups.hasOwnProperty(norm)) {
                const keys = experimentGroups[norm];
                const blocksHtml = keys.map(k => renderExperimentBlock(k)).join('');
                appendOutputBlock(blocksHtml);
                return;
            }

            // Check individual sub-experiment (1a, 1b, 2a, 2b, 10a, 10b, etc.)
            if (experiments.hasOwnProperty(norm)) {
                appendOutputBlock(renderExperimentBlock(norm));
                return;
            }

            // Support "exp 1", "q1", "ex 1a", etc.
            const expMatch = norm.match(/^(?:exp|experiment|ex|q|question)\s*([0-9]{1,2}[abc]?)$/);
            if (expMatch) {
                const target = expMatch[1];
                if (experimentGroups.hasOwnProperty(target)) {
                    const blocksHtml = experimentGroups[target].map(k => renderExperimentBlock(k)).join('');
                    appendOutputBlock(blocksHtml);
                    return;
                }
                if (experiments.hasOwnProperty(target)) {
                    appendOutputBlock(renderExperimentBlock(target));
                    return;
                }
            }

            // List all experiments
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === 'help()' || lower === '?') {
                appendOutputBlock(renderExperimentList());
                return;
            }

            // Copy command: "copy <1-11>" or "cp <1a>"
            const copyMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2}\.?[abc]?|project)$/);
            if (copyMatch) {
                const targetKey = normalizeKey(copyMatch[1]);
                if (experimentGroups.hasOwnProperty(targetKey)) {
                    const combinedCode = experimentGroups[targetKey].map(k => `# ${experiments[k].title}\n${experiments[k].code}`).join('\n\n');
                    const ok = copyTextToClipboard(combinedCode, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Program(s) copied to clipboard.</div>`);
                    }
                    return;
                }
                if (experiments.hasOwnProperty(targetKey)) {
                    const ok = copyTextToClipboard(experiments[targetKey].code, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Program copied to clipboard.</div>`);
                    }
                    return;
                }
            }

            // All experiments at once (1 to 10)
            if (lower === 'all') {
                for (let i = 1; i <= 10; i++) {
                    const keys = experimentGroups[String(i)];
                    keys.forEach(k => appendOutputBlock(renderExperimentBlock(k)));
                }
                return;

            // Free hosting guide

            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep input focused when clicking terminal background unless selecting code text
        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }
