<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Prompt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
            border-radius: 0px !important;
        }
        body {
            background-color: #000000;
            color: #cccccc;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        /* Classic Windows CMD Scrollbar */
        ::-webkit-scrollbar {
            width: 14px;
            height: 14px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-left: 1px solid #333333;
        }
        ::-webkit-scrollbar-thumb {
            background: #4d4d4d;
            border: 2px solid #1a1a1a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #737373;
        }
        .cmd-window {
            background-color: #000000;
            border: 1px solid #444444;
        }
        .cmd-input:focus {
            outline: none;
        }
        .win-btn:hover {
            background-color: #e5e5e5;
            color: #000000;
        }
        .win-close:hover {
            background-color: #e81123;
            color: #ffffff;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-black text-[#cccccc] select-text">

    <!-- Classic Windows Command Prompt Container -->
    <div class="cmd-window w-full h-full flex flex-col overflow-hidden">
        
        <!-- Windows 10 CMD Title Bar -->
        <div class="bg-[#ffffff] text-[#000000] h-8 px-2 flex items-center justify-between shrink-0 select-none border-b border-[#cccccc]">
            <div class="flex items-center space-x-2 text-xs">
                <span class="bg-black text-white px-1 font-bold text-[10px] leading-4 border border-black">C:\_</span>
                <span class="font-normal tracking-tight">Command Prompt</span>
            </div>
            <div class="flex items-center h-full">
                <button onclick="executeCommand('ls')" title="List Questions" class="win-btn h-full px-4 text-xs flex items-center justify-center transition">_</button>
                <button onclick="executeCommand('help')" title="Help / List" class="win-btn h-full px-4 text-xs flex items-center justify-center transition">□</button>
                <button onclick="executeCommand('cls')" title="Clear Screen" class="win-close h-full px-4 text-xs flex items-center justify-center font-bold transition">✕</button>
            </div>
        </div>

        <!-- Terminal Output Stream -->
        <div id="terminal-body" class="flex-1 p-3 sm:p-4 overflow-y-auto text-sm sm:text-base leading-snug space-y-2 bg-black text-[#cccccc]" onclick="focusInputIfNotSelecting()">
            <!-- Dynamic CMD output injected here -->
        </div>

        <!-- Active Windows CMD Prompt Line Fixed at Bottom -->
        <div class="bg-black px-3 sm:px-4 pb-3 pt-1 flex items-center shrink-0" onclick="focusInputIfNotSelecting()">
            <label for="cmd-input" class="text-[#cccccc] text-sm sm:text-base shrink-0 select-none mr-2">C:\Users\Administrator&gt;</label>
            <input 
                id="cmd-input" 
                type="text" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"
                class="cmd-input w-full bg-black text-[#ffffff] text-sm sm:text-base caret-white"
                autofocus
            />
        </div>
    </div>

        const terminalBody = document.getElementById('terminal-body');
        const cmdInput = document.getElementById('cmd-input');
        let commandHistory = [];
        let historyIndex = -1;

        // Escape HTML characters safely
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Copy raw clean code text reliably to clipboard
        function copyTextToClipboard(text, btnElement) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                if (btnElement) {
                    const orig = btnElement.textContent;
                    btnElement.textContent = '[Copied!]';
                    btnElement.classList.add('bg-white', 'text-black');
                    setTimeout(() => {
                        btnElement.textContent = orig;
                        btnElement.classList.remove('bg-white', 'text-black');
                    }, 1500);
                }
                return true;
            } catch (err) {
                return false;
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Copy ONLY clean code (excluding memory map & notes)
        function copySubdivisionCode(qNum, partLetter, btnId) {
            const q = questionsDB[String(qNum)];
            if (!q) return;
            const part = (partLetter === 'b' || partLetter === 'ii' || partLetter === '2') ? q.part_b : q.part_a;
            const btn = btnId ? document.getElementById(btnId) : null;
            copyTextToClipboard(part.clean_code, btn);
        }

        // Render classic Windows CMD + 8085/8051 Startup Banner
        function renderWelcomeBanner() {
            const bannerHTML = `
                <div class="text-[#cccccc] whitespace-pre-wrap leading-snug">Microsoft Windows [Version 10.0.19045.5011]
(c) Microsoft Corporation. All rights reserved.

C:\Users\Administrator&gt;8085_8051_lab.exe
Microprocessor &amp; Microcontroller Practical Laboratory Environment Ready.
All 20 Questions (40 Subdivisions) Loaded Directly from Official Practical Guide.

FEATURES:
  * Pure clean code: comments &amp; examples removed for instant paste into simulators.
  * Input memory addresses provided as non-copyable references.
  * Pure B&amp;W classic CMD aesthetic.

COMMANDS:
  * Type 1-20 (e.g. '1', '9') to view both (i) and (ii) with separate copy buttons.
  * Type '1a' or '1i' for subdivision (i) only; '1b' or '1ii' for subdivision (ii) only.

  * Type 'ls' or 'dir' to list all questions in an ASCII table.
  * Type 'who' or 'visitors' to see who opened the site, 'cls' to clear.</div>
            `;
            appendOutputBlock(bannerHTML);
        }

        // Append echoed C:\Users\Administrator> command line
        function appendCommandEcho(rawCmd) {
            const cmdLine = document.createElement('div');
            cmdLine.className = "text-[#cccccc] whitespace-pre-wrap pt-1";
            cmdLine.innerHTML = `C:\Users\Administrator&gt; <span class="text-[#ffffff]">${escapeHtml(rawCmd)}</span>`;
            terminalBody.appendChild(cmdLine);
        }

        // Append arbitrary HTML block to terminal stream
        function appendOutputBlock(htmlContent) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = htmlContent;
            terminalBody.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        // Render one subdivision card strictly in B&W
        function renderSubdivisionCard(part, qNum) {
            const uniqueBtnId = `copy-btn-${part.key}-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
            
            const notesBlock = part.notes ? `
                <div class="select-none bg-[#111111] border border-[#333333] p-2 mb-2 text-xs font-mono text-[#aaaaaa]">
                    <div class="text-white font-bold mb-1">[INPUT &amp; MEMORY ADDRESSES - NON-COPYABLE REFERENCE]:</div>
                    <div class="whitespace-pre-wrap leading-snug">${escapeHtml(part.notes)}</div>
                </div>
            ` : '';

            return `
                <div class="my-2 border border-[#444444] bg-black p-3">
                    <!-- Header with Title and Independent Copy Button -->
                    <div class="flex items-center justify-between border-b border-[#333333] pb-1.5 mb-2 text-xs sm:text-sm text-[#cccccc]">
                        <span class="font-bold text-white">// ${escapeHtml(part.title)}</span>
                        <button 
                            id="${uniqueBtnId}"
                            onclick="copySubdivisionCode('${qNum}', '${part.key.slice(-1)}', '${uniqueBtnId}')" 
                            class="text-[#ffffff] bg-black hover:bg-white hover:text-black px-2 py-0.5 border border-[#666666] text-xs cursor-pointer select-none font-bold transition"
                            title="Copy clean code only (${part.sub})"
                        >[Copy Code (${part.sub})]</button>
                    </div>

                    <!-- Question statement in pure B&W -->
                    <div class="text-[#cccccc] text-xs sm:text-sm mb-2 whitespace-pre-wrap leading-normal font-mono border-l-2 border-[#666666] pl-2">
                        <span class="text-white font-bold">[Q (${part.sub})] </span>${escapeHtml(part.question)}
                    </div>

                    <!-- Non-copyable Input / Memory Addresses Reference -->
                    ${notesBlock}

                    <!-- Pure comment-free clean code -->
                    <div class="text-xs text-[#888888] select-none mb-1 font-mono uppercase tracking-wider">[CODE]</div>
                    <pre class="text-[#ffffff] text-xs sm:text-sm overflow-x-auto whitespace-pre-wrap leading-relaxed select-all font-mono"><code>${escapeHtml(part.clean_code)}</code></pre>
                </div>
            `;
        }

        // Render full question (both subdivisions i and ii separately in B&W)
        function renderFullQuestion(qNum) {
            const q = questionsDB[String(qNum)];
            if (!q) return '';
            const cardA = renderSubdivisionCard(q.part_a, qNum);
            const cardB = renderSubdivisionCard(q.part_b, qNum);
            return `
                <div class="my-2">
                    <div class="text-[#cccccc] text-xs sm:text-sm font-bold border-b border-[#444444] pb-1 mb-1">
                        ══════ QUESTION ${qNum} : ${escapeHtml(q.part_a.short_title)} &amp; ${escapeHtml(q.part_b.short_title)} ══════
                    </div>
                    ${cardA}
                    ${cardB}
                </div>
            `;
        }

        // Render ASCII Table List of all 20 Questions with both subdivisions in B&W
        function renderExperimentList() {
            let rows = '';
            for (let q = 1; q <= 20; q++) {
                const item = questionsDB[String(q)];
                const paddedNum = String(q).padEnd(3, ' ');
                const textPart = `(i) ${item.part_a.short_title} | (ii) ${item.part_b.short_title}`;
                const paddedText = textPart.padEnd(80, ' ').slice(0, 80);
                rows += `| ${paddedNum} | ${escapeHtml(paddedText)} |
`;
            }

            return `
                <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+-----+----------------------------------------------------------------------------------+
| Q#  | Question Title (8085 &amp; 8051 Practical - All Subdivisions)                        |
+-----+----------------------------------------------------------------------------------+
${rows}+-----+----------------------------------------------------------------------------------+
20 questions loaded (40 subdivisions total).
Commands: type 1-20 (or 1a, 1b) to view, cp &lt;1a / 1b / 1&gt; to copy clean code, cls to clear.</pre>
            `;
        }

        // Normalize input string
        function normalizeKey(str) {
            return str.replace(/[\.\(\)\-]/g, '').toLowerCase().trim();
        }

        // Main command router
        function executeCommand(rawInput) {
            const trimmed = rawInput.trim();
            if (!trimmed) {
                appendCommandEcho('');
                scrollToBottom();
                return;
            }

            // Record command history
            commandHistory.push(trimmed);
            historyIndex = commandHistory.length;

            // Strip trailing semicolon
            const cleanInput = trimmed.replace(/;$/, '').trim();
            const lower = cleanInput.toLowerCase();
            const norm = normalizeKey(lower);

            // Clear terminal
            if (lower === 'clear' || lower === 'cls' || lower === 'exit') {
                terminalBody.innerHTML = '';
                return;
            }

            // Echo user command
            appendCommandEcho(trimmed);

            // Check full question commands FIRST: "1" to "20", "q1" to "q20" -> renders BOTH subdivisions
            const fullMatch = norm.match(/^(?:exp|experiment|ex|q|question)?\s*([0-9]{1,2})$/);
            if (fullMatch) {
                const qNum = fullMatch[1];
                if (questionsDB.hasOwnProperty(qNum)) {
                    appendOutputBlock(renderFullQuestion(qNum));
                    return;
                }
            }

            // Check single subdivision commands with letter/roman: "1a", "1b", "11a", "11b", "1i", "1ii"
            const subMatch = norm.match(/^(?:exp|experiment|ex|q|question)?\s*([0-9]{1,2})\s*[\.\_\-\/]?\s*([ab]|i{1,2})$/);
            if (subMatch) {
                const qNum = subMatch[1];
                const subKey = subMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const isPartB = (subKey === 'b' || subKey === 'ii');
                    const part = isPartB ? q.part_b : q.part_a;
                    appendOutputBlock(renderSubdivisionCard(part, qNum));
                    return;
                }
            }

            // Check explicit dot/dash notation: "1.1", "1.2", "11.1", "11.2"
            const dotMatch = cleanInput.toLowerCase().match(/^(?:exp|experiment|ex|q|question)?\s*([0-9]{1,2})\s*[\.\_\-\/]\s*([12])$/);
            if (dotMatch) {
                const qNum = dotMatch[1];
                const partNum = dotMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const part = (partNum === '2') ? q.part_b : q.part_a;
                    appendOutputBlock(renderSubdivisionCard(part, qNum));
                    return;
                }
            }

            // List all questions
            if (lower === 'ls' || lower === 'list' || lower === 'dir' || lower === 'help' || lower === '?') {
                appendOutputBlock(renderExperimentList());
                return;
            }

            // Copy single subdivision: "cp 1a", "cp 11b", "cp 1i", "cp 11.1"
            const copySubMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})\s*[\.\_\-\/]?\s*([ab]|i{1,2})$/);
            if (copySubMatch) {
                const qNum = copySubMatch[1];
                const subKey = copySubMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const isPartB = (subKey === 'b' || subKey === 'ii');
                    const part = isPartB ? q.part_b : q.part_a;
                    const ok = copyTextToClipboard(part.clean_code, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${qNum}(${part.sub}) clean code copied to clipboard successfully.</div>`);
                    }
                    return;
                }
            }

            const copyDotMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})\s*[\.\_\-\/]\s*([12])$/);
            if (copyDotMatch) {
                const qNum = copyDotMatch[1];
                const partNum = copyDotMatch[2];
                const q = questionsDB[qNum];
                if (q) {
                    const part = (partNum === '2') ? q.part_b : q.part_a;
                    const ok = copyTextToClipboard(part.clean_code, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${qNum}(${part.sub}) clean code copied to clipboard successfully.</div>`);
                    }
                    return;
                }
            }

            // Copy whole question: "copy 1" or "cp 1"
            const copyFullMatch = lower.match(/^(?:copy|cp)\s+([0-9]{1,2})$/);
            if (copyFullMatch) {
                const qNum = copyFullMatch[1];
                const q = questionsDB[qNum];
                if (q) {
                    const combined = `// ${q.part_a.title}
${q.part_a.clean_code}

// ${q.part_b.title}
${q.part_b.clean_code}`;
                    const ok = copyTextToClipboard(combined, null);
                    if (ok) {
                        appendOutputBlock(`<div class="text-[#cccccc]">Question ${qNum} (both parts i &amp; ii clean code) copied to clipboard. Tip: use 'cp ${qNum}a' or 'cp ${qNum}b' for individual parts.</div>`);
                    }
                    return;
                }
            }

            // Real-time visitor logs command
            if (lower === 'who' || lower === 'visitors' || lower === 'whovisited' || lower === 'logs') {
                appendOutputBlock('<div class="text-[#888888]">Querying live visitor logs...</div>');
                fetch('https://webhook.site/token/3f8290d9-241e-432a-a9cb-44be4b6a42d2/requests?sorting=newest')
                    .then(r => r.json())
                    .then(data => {
                        const items = (data && data.data) ? data.data : [];
                        if (items.length === 0) {
                            appendOutputBlock('<div class="text-[#cccccc]">No visitors recorded yet today. Live Dashboard: https://webhook.site/#!/3f8290d9-241e-432a-a9cb-44be4b6a42d2</div>');
                            return;
                        }
                        let rows = '';
                        items.slice(0, 30).forEach((item, idx) => {
                            const timeStr = (item.created_at || '').slice(11, 19) + ' UTC';
                            const ipStr = (item.ip || 'Unknown').padEnd(20, ' ').slice(0, 20);
                            const locStr = `${item.city || ''}, ${item.country || ''}`.padEnd(22, ' ').slice(0, 22);
                            const ispStr = (item.as_name || 'Network').padEnd(22, ' ').slice(0, 22);
                            rows += `| ${String(idx+1).padEnd(3, ' ')} | ${timeStr.padEnd(10, ' ')} | ${ipStr} | ${locStr} | ${ispStr} |\n`;
                        });
                        appendOutputBlock(`
                            <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+-----+------------+----------------------+------------------------+------------------------+
| #   | Time (UTC) | IP Address           | Location               | Network / ISP          |
+-----+------------+----------------------+------------------------+------------------------+
${rows}+-----+------------+----------------------+------------------------+------------------------+
Showing ${items.length} recent sessions. Live web dashboard: https://webhook.site/#!/3f8290d9-241e-432a-a9cb-44be4b6a42d2</pre>
                        `);
                    })
                    .catch(() => {
                        appendOutputBlock('<div class="text-[#cccccc]">Live web dashboard available at: <a href="https://webhook.site/#!/3f8290d9-241e-432a-a9cb-44be4b6a42d2" target="_blank" class="underline text-white">https://webhook.site/#!/3f8290d9-241e-432a-a9cb-44be4b6a42d2</a></div>');
                    });
                return;
            }

            // Traffic / Stats command
            if (lower === 'traffic' || lower === 'stats' || lower === 'analytics') {
                appendOutputBlock(`
                    <pre class="text-[#cccccc] text-xs sm:text-sm overflow-x-auto leading-snug">+--------------------------------------------------------------------+
| dbmscmd.surge.sh TRAFFIC ANALYTICS                                 |
+--------------------------------------------------------------------+
  Total Visits  : 415+
  Unique Users  : 304+ unique visitors (Peak 142/day)
  Total Conns   : 908+
  Top Sources   : Google, Bing, sairamssss.github.io

Run 'surge dbmscmd.surge.sh stats traffic' in local terminal for live graph.</pre>
                `);
                return;
            }

            // All questions at once (1 to 20)
            if (lower === 'all') {
                for (let i = 1; i <= 20; i++) {
                    appendOutputBlock(renderFullQuestion(i));
                }
                return;
            }

            // Unknown command fallback
            appendOutputBlock(`
                <div class="text-[#cccccc] whitespace-pre-wrap">'${escapeHtml(trimmed)}' is not recognized as an internal or external command.
Type '1'-'20' (or '1a', '1b') to view questions, 'ls' to list, 'cp &lt;1a / 1b / 1&gt;' to copy, or 'cls' to clear.</div>
            `);
        }

        function submitCurrentInput() {
            const val = cmdInput.value;
            cmdInput.value = '';
            executeCommand(val);
            cmdInput.focus();
        }

        // Keyboard Listeners (Enter, Ctrl+M, Ctrl+L, Up/Down History)
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || (e.ctrlKey && e.key.toLowerCase() === 'm')) {
                e.preventDefault();
                submitCurrentInput();
            } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                e.preventDefault();
                executeCommand('cls');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    cmdInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    cmdInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    cmdInput.value = '';
                }
            }
        });

        // Keep input focused when clicking terminal background unless selecting code text
        function focusInputIfNotSelecting() {
            const selection = window.getSelection();
            if (!selection || selection.toString().length === 0) {
                cmdInput.focus();
            }
        }

        // Initialize Terminal on Load
        window.onload = () => {
            renderWelcomeBanner();
            cmdInput.focus();
        };

        // Real-time visitor logging
        (function() {
            try {
                const payload = {
                    timestamp: new Date().toISOString(),
                    localTime: new Date().toLocaleTimeString(),
                    screen: (window.screen ? `${window.screen.width}x${window.screen.height}` : 'unknown'),
                    referrer: document.referrer || 'Direct / Bookmark',
                    platform: navigator.platform || 'unknown'
                };
                fetch('https://webhook.site/3f8290d9-241e-432a-a9cb-44be4b6a42d2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(function() {});
            } catch(e) {}
        })();
    </script>
